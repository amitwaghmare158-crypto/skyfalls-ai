
<!DOCTYPE html>
<html>
<head>

<title>Skyfalls AI</title>

<style>

body{
font-family:Arial;
margin:0;
background:#ffffff;
}

header{
background:#f4f4f4;
padding:15px;
display:flex;
justify-content:space-between;
}

nav a{
margin:10px;
text-decoration:none;
color:#333;
}

.container{
text-align:center;
margin-top:80px;
}

input{
padding:10px;
width:250px;
}

button{
padding:10px;
background:#10a37f;
color:white;
border:none;
cursor:pointer;
}

.card{
background:#f5f5f5;
padding:20px;
margin:20px auto;
width:300px;
border-radius:10px;
}

</style>

</head>

<body>

<header>

<h2>🚀 Skyfalls AI</h2>

<nav>

<a onclick="show('chat')">Chat</a>
<a onclick="show('image')">Image AI</a>
<a onclick="show('login')">Login</a>
<a onclick="show('signup')">Sign Up</a>
<a onclick="show('profile')">Profile</a>

</nav>

</header>

<div class="container">

<div id="chat">

<h2>AI Chat</h2>

<input id="msg" placeholder="Ask anything..." />
<button onclick="askAI()">Send</button>

<p id="reply"></p>

</div>

<div id="image" style="display:none">

<h2>Image Generator</h2>

<input placeholder="Describe image..." />
<button>Generate</button>

<p>Image generator UI demo</p>

</div>

<div id="login" style="display:none">

<h2>Login</h2>

<input placeholder="Email"><br><br>
<input placeholder="Password"><br><br>

<button>Login</button>

</div>

<div id="signup" style="display:none">

<h2>Create Account</h2>

<input placeholder="Email"><br><br>
<input placeholder="Password"><br><br>

<button>Sign Up</button>

</div>

<div id="profile" style="display:none">

<h2>Your Profile</h2>

<div class="card">

<p>Plan: Free</p>

<button>Upgrade Premium ₹99</button><br><br>

<button>Upgrade Pro ₹999</button>

</div>

</div>

</div>

<script>

function show(id){

document.getElementById("chat").style.display="none";
document.getElementById("image").style.display="none";
document.getElementById("login").style.display="none";
document.getElementById("signup").style.display="none";
document.getElementById("profile").style.display="none";

document.getElementById(id).style.display="block";

}

async function askAI(){

let msg=document.getElementById("msg").value;

let response=await fetch(
"https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=YOUR_API_KEY",
{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
contents:[{parts:[{text:msg}]}]
})
}
);

let data=await response.json();

document.getElementById("reply").innerText=
data.candidates[0].content.parts[0].text;

}

</script>

</body>
</html>
